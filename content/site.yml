sub_kulinarna:
  pl: 'Dania, menu i atmosfera lokalu w świetle, które sprzedaje. #1 wśród fotografów kulinarnych Foodelia 2025.'
  en: 'Dishes, menus and the mood of the place in light that sells. Ranked #1 food photographer on Foodelia 2025.'
sub_biznes:
  pl: Wnętrza restauracji, portret wizerunkowy dla marek i osobistości. Profesjonalnie i naturalnie.
  en: Restaurant interiors, brand and personal portraits for companies and public figures. Professional and natural.
sub_hotele:
  pl: Hotele, restauracje i wnętrza sfotografowane tak, żeby gość chciał tam być, zanim jeszcze przyjedzie.
  en: Hotels, restaurants and interiors photographed so a guest wants to be there before they even arrive.
sub_wydarzenia:
  pl: Festiwale, gale, koncerty i premiery. Tam, gdzie dzieje się coś ważnego, jestem z aparatem od kulis po scenę.
  en: Festivals, galas, concerts and premieres. Where something important is happening, I am there with a camera, from backstage to the stage.
sub_teatr:
  pl: Spektakle, próby i festiwale. Najcenniejsze są chwile, których widz nie zobaczy, tam zaczyna się prawdziwy teatr.
  en: Performances, rehearsals and festivals. The most precious moments are the ones the audience never sees, that is where real theatre begins.
sub_sluby:
  pl: Reportaż z najważniejszego dnia, bez sztucznych póz i bez retuszu. Emocje, światło i moment, który wydarzył się naprawdę.
  en: Documentary coverage of your most important day, no forced poses, no retouching. Emotion, light and the moment that really happened.
cap_hotele:
  pl: Hotel to obietnica, a wnętrze ją składa. Fotografuję przestrzenie tak, żeby światło, faktura i klimat sprzedawały pobyt, zanim gość przekroczy próg.
  en: A hotel is a promise and the interior keeps it. I photograph spaces so that light, texture and atmosphere sell the stay before the guest even walks in.
