  desc_pl: "Fotograf z kilkunastoletnim stażem. Kulinaria, biznes, wydarzenia, teatr i śluby. Zdjęcia bez Photoshopa i AI. Pracuję po polsku i angielsku."
  title_en: "About — Marcin Kaźmieruk, photographer from Poland"
  desc_en: "Photographer with over a decade of experience. Food, business, events, theatre and weddings. Photos without Photoshop or AI. I work in Polish and English."
