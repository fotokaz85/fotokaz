index.html:
  title_pl: "Marcin Kaźmieruk — fotograf kulinarny, eventowy i komercyjny · Jelenia Góra"
  desc_pl: "Fotograf kulinarny, biznesowy, eventowy, teatralny i ślubny. #1 na świecie Foodelia 2025, nagrody IPA 2026. Zdjęcia bez Photoshopa i AI. Jelenia Góra i cała Polska."
  title_en: "Marcin Kaźmieruk — Food, Event & Commercial Photographer · Poland"
  desc_en: "Food, business, event, theatre and wedding photographer. #1 in the world at Foodelia 2025, IPA 2026 awards. Photography without Photoshop or AI. Poland, working worldwide."
kulinarna.html:
  title_pl: "Fotografia kulinarna — zdjęcia potraw i dań | Marcin Kaźmieruk"
  desc_pl: "Profesjonalna fotografia kulinarna. #1 na świecie Foodelia 2025. Zdjęcia potraw, restauracji i menu, które sprzedają. Jelenia Góra, Wrocław, cała Polska."
  title_en: "Food Photography — dishes, restaurants, menus | Marcin Kaźmieruk"
  desc_en: "Professional food photography. #1 in the world at Foodelia 2025. Photos of dishes, restaurants and menus that sell. Based in Poland, working across Europe."
biznes.html:
  title_pl: "Fotografia biznesowa i wizerunkowa | Marcin Kaźmieruk"
  desc_pl: "Fotografia biznesowa, portrety wizerunkowe, wnętrza i realizacje dla marek. Buduj zaufanie od pierwszego spojrzenia. Jelenia Góra i cała Polska."
  title_en: "Business & Brand Photography | Marcin Kaźmieruk"
  desc_en: "Corporate and brand photography, headshots, interiors and campaigns. Build trust at first glance. Based in Poland, working across Europe."
hotele.html:
  title_pl: "Fotografia wnętrz i hoteli | Marcin Kaźmieruk"
  desc_pl: "Fotografia wnętrz hotelowych, restauracji i przestrzeni komercyjnych. Kadry, które sprzedają pobyt. Jelenia Góra i cała Polska."
  title_en: "Hotel & Interior Photography | Marcin Kaźmieruk"
  desc_en: "Hotel, restaurant and commercial interior photography. Frames that sell the stay. Based in Poland, working across Europe."
wydarzenia.html:
  title_pl: "Fotografia eventowa — festiwale, koncerty, gale | Marcin Kaźmieruk"
  desc_pl: "Fotografia eventowa: festiwale, koncerty, gale i wydarzenia firmowe. Oficjalny fotograf Beats for Love od 2017. Energia sceny w każdym kadrze."
  title_en: "Event Photography — festivals, concerts, galas | Marcin Kaźmieruk"
  desc_en: "Event photography: festivals, concerts, galas and corporate events. Official Beats for Love photographer since 2017. The energy of the stage in every frame."
teatr.html:
  title_pl: "Fotografia teatralna — spektakle i próby | Marcin Kaźmieruk"
  desc_pl: "Fotografia teatralna: spektakle, próby i festiwale. Światło, gest i napięcie sceny uchwycone naturalnie, bez inscenizacji."
  title_en: "Theatre Photography — performances & rehearsals | Marcin Kaźmieruk"
  desc_en: "Theatre photography: performances, rehearsals and festivals. Light, gesture and stage tension captured naturally."
sluby.html:
  title_pl: "Fotografia ślubna — reportaż z całego dnia | Marcin Kaźmieruk"
  desc_pl: "Fotografia ślubna wśród najlepszych na świecie. Stypendysta Two Mann Studios, nagrody PSKŚ. Reportaż pełen emocji, bez ustawianych scen. Jelenia Góra i cała Polska."
  title_en: "Wedding Photography — full-day storytelling | Marcin Kaźmieruk"
  desc_en: "Wedding photography among the world's best. Two Mann Studios scholarship, PSKŚ awards. Honest, emotional storytelling, no staged scenes. Poland and abroad."
wyroznienia.html:
