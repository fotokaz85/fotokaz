# Netlify uruchamia to przy każdej zmianie w panelu i publikuje folder public/
[build]
  command = "pip install beautifulsoup4 pyyaml && python3 build.py"
  publish = "public"

[build.environment]
  PYTHON_VERSION = "3.11"

# --- Przekierowania domen ---
[[redirects]]
  from = "https://fotokaz.com/*"
  to = "https://fotokaz.pl/en/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.fotokaz.com/*"
  to = "https://fotokaz.pl/en/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://marcinkazmieruk.pl/*"
  to = "https://fotokaz.pl/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.marcinkazmieruk.pl/*"
  to = "https://fotokaz.pl/:splat"
  status = 301
  force = true
